# Parallax engine configuration
#
# Binds pipeline ROLES to ENGINES, keyed by pipeline. Each skill names the key it
# reads (dev -> `dev`, goal-spec -> `goal-spec`, review -> `review`). Each skill's SKILL.md is
# fully self-contained — it documents its own pipeline steps and handoffs — and
# resolves each role to its engine from this file before running. The values below
# are the shipped defaults. Edit a value to swap the engine for that role.
#
# Engines resolve to named subagent personas, so the TUI shows which engine ran a
# lane. Each persona carries its own rubric + operator manual — the caller (the
# orchestrator; for review lanes in dev, the build worker) hands it only the repo
# path and a task-specific brief:
#
#   role                engine -> persona
#   plan (goal-spec)    claude -> plx:claude-planner             (Opus, read-only)
#                       codex  -> plx:codex-planner              (drives bin/plx-codex-ro)
#                       grok   -> plx:grok-planner               (drives bin/plx-grok-ro)
#   plan-critic         codex  -> plx:codex-plan-critic          (drives bin/plx-codex-ro; red-team)
#   code                claude -> plx:claude-worker              (Opus, edits the repo)
#                       codex  -> plx:codex-worker               (drives bin/plx-codex-rw)
#                       grok   -> plx:grok-worker                (drives bin/plx-grok-rw)
#   review-correctness  claude -> plx:claude-reviewer-correctness  (Opus, read-only)
#                       codex  -> plx:codex-reviewer-correctness   (drives bin/plx-codex-ro)
#                       grok   -> plx:grok-reviewer-correctness    (drives bin/plx-grok-ro)
#   review-cleanup      claude -> plx:claude-reviewer-cleanup      (Opus, read-only)
#                       codex  -> plx:codex-reviewer-cleanup       (drives bin/plx-codex-ro)
#                       grok   -> plx:grok-reviewer-cleanup        (drives bin/plx-grok-ro)
#   review-structural   claude -> plx:claude-reviewer-structural   (Opus, read-only)
#                       codex  -> plx:codex-reviewer-structural    (drives bin/plx-codex-ro)
#                       grok   -> plx:grok-reviewer-structural     (drives bin/plx-grok-ro)
#
# Rules:
#   - `code` takes exactly ONE engine — one writer at a time, always.
#   - plan / plan-critic / review-* roles take LISTS and are always read-only, whatever
#     engine fills them.
#   - Plan authoring and the final review gate are always the orchestrator; finding
#     triage in the build's review round is the build worker. Neither is configurable.
#   - In `dev` the orchestrator authors the plan; in `goal-spec` a single `plan` lane
#     drafts the design and the orchestrator synthesizes. Either way a `plan-critic` lane
#     red-teams before it ships, and authoring/synthesis is never delegated.
#
# Disabled pipelines (team-*, ultra-*) have no keys here; they are regenerated
# from the dev spec in .project/VISION.md when revived.

pipelines:
  dev:
    plan-critic: [codex]
    code: claude
    review-correctness: [codex]
    review-cleanup: [codex]
    review-structural: [codex]

  goal-spec:
    plan: [claude]
    plan-critic: [codex]

  review:
    review-correctness: [codex]
    review-cleanup: [codex]
    review-structural: [codex]
