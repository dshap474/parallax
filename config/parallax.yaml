# Parallax engine configuration
#
# Binds pipeline ROLES to ENGINES, keyed by pipeline. Each skill names the key it
# reads (dev -> `dev`, goal-spec -> `goal-spec`, review -> `review`). Each skill's
# SKILL.md is fully self-contained — it documents its own pipeline steps — and
# resolves each role to its engine from this file before running. The values below
# are the shipped defaults: they are defaults, not limits — the orchestrator may
# swap or add engines per the judgment doc (`plx-engine --print-rubric engines`).
#
# Every role runs as one headless `plx-engine` call made by the orchestrator —
# no subagents. The role determines the rubric and mode:
#
#   role                mode  rubric
#   plan (goal-spec)    ro    planner
#   plan-critic         ro    plan-critic
#   code                rw    worker
#   review-correctness  ro    reviewer-correctness
#   review-cleanup      ro    reviewer-cleanup
#   review-structural   ro    reviewer-structural
#
# Rules:
#   - `code` takes exactly ONE engine — one writer at a time, always.
#   - plan / plan-critic / review-* roles take LISTS and are always read-only
#     (`--mode ro`), whatever engine fills them.
#   - Plan authoring, review synthesis, and the final gate are always the
#     orchestrator. Never delegated, not configurable.
#   - Cross-engine review is the default posture: prefer review engines that
#     didn't write the code.

pipelines:
  dev:
    plan-critic: [codex]
    code: claude
    review-correctness: [codex]
    review-cleanup: [codex]
    review-structural: [codex]

  goal-spec:
    plan: [claude]
    plan-critic: [codex]

  review:
    review-correctness: [codex]
    review-cleanup: [codex]
    review-structural: [codex]
